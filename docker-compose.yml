services:
  postgres:
    image: postgres:16-alpine
    container_name: nexa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: nexa
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexa"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  server:
    image: ${NEXA_IMAGE:-ghcr.io/kiteyuan/nexapulsebot:latest}
    container_name: nexapulsebot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://nexa:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/nexa?sslmode=disable
      NEXA_ADMIN_TOKEN: ${NEXA_ADMIN_TOKEN:?set NEXA_ADMIN_TOKEN in .env}
      NEXA_IMAGE_BASE_URL: ${NEXA_IMAGE_BASE_URL:-https://image.kiteyuan.info}
      NEXA_IMAGE_AUTH: ${NEXA_IMAGE_AUTH:-}
      # Listen on all interfaces inside the container so host port mapping works.
      # Host side MUST stay 127.0.0.1:8081 — never publish Admin as 0.0.0.0:8081.
      NEXA_PUBLIC_ADDR: ":8080"
      NEXA_ADMIN_ADDR: ":8081"
    ports:
      - "8080:8080"
      - "127.0.0.1:8081:8081"
    volumes:
      - ./data/sessions:/app/data/sessions
